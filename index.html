<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self';" />
    <title>LoL Flash Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="panel">
      <!-- Tiny drag handle + controls -->
      <div id="grip">
        <span class="handle" title="Drag to move">&#10247;</span>
        <div class="actions">
          <button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
          <button id="close" title="Close (Ctrl+Shift+Space to hide)" aria-label="Close">&times;</button>
        </div>
      </div>

      <!-- Settings drawer (collapsed by default) -->
      <section id="settings" class="hidden">
        <div class="cd-row">
          <input id="cdInput" type="number" min="1" max="600" step="1" title="Flash cooldown (seconds)" />
          <div class="presets">
            <button class="preset" data-cd="300" title="Base Flash">300</button>
            <button class="preset" data-cd="254" title="Cosmic Insight">254</button>
            <button class="preset" data-cd="234" title="Cosmic Insight + Lucidity boots">234</button>
          </div>
        </div>
      </section>

      <!-- Role rows get injected here -->
      <main id="rows"></main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
